[project]
name = "tongagents-cli-sample"
version = "0.4.0"
description = "Minimal CLI sample using TongAgents SDK (default agent + local tools, 本地 wheel 安装)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # tongagents / tongagents-cli 从 ../wheels/ 本地 wheel 安装（不走 Nexus）
    "tongagents==2.7.65",
    "tongagents-cli==1.8.65",
    # dotenv (读 .env)
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
tongagents = { path = "../wheels/tongagents-2.7.65-cp312-cp312-linux_x86_64.whl" }
tongagents-cli = { path = "../wheels/tongagents_cli-1.8.65-cp312-cp312-linux_x86_64.whl" }

[tool.setuptools]
py-modules = ["cli_sample"]

[tool.setuptools.package-dir]
tools = "tools"
