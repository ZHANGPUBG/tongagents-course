[project]
name = "tongagents-lesson4"
version = "0.1.0"
description = "Lesson 4 — 仿照 cli-sample 重写本地文件 CLI Agent 作业脚手架 (ReAct 循环 / 模型调用 / 工具注册与结果回填)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # tongagents SDK 从 ../wheels/ 本地 wheel 安装（不走 Nexus）
    "tongagents==2.7.65",
    # dotenv (cli_file_sample.py 读 .env)
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
tongagents = { path = "../wheels/tongagents-2.7.65-cp312-cp312-linux_x86_64.whl" }

[tool.setuptools]
py-modules = ["check_homework", "cli_file_sample"]
packages = ["tools"]
